services:
  database:
    image: postgres:18
    container_name: seminary-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: seminary-db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: drizzle-adminer
    ports:
      - "8080:8080"
    depends_on:
      - database

volumes:
  pgdata:
